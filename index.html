<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduQuiz — Trò chơi học tập tương tác</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://unpkg.com/mathlive@0.104.0/dist/mathlive.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<header>
  <div class="logo">🎓 EduQuiz</div>
  <nav id="mainNav">
    <button data-nav="home">Trang chủ</button>
    <button data-nav="library">Thư viện của tôi</button>
    <button data-nav="create">+ Tạo bộ câu hỏi</button>
    <button data-nav="classes">🏫 Lớp học</button>
    <button data-nav="contests">🏆 Cuộc thi</button>
    <button data-nav="reports">Báo cáo</button>
    <button data-nav="admin" id="adminBtn" style="display:none">👑 Quản trị</button>
  </nav>
  <div id="authArea" class="autharea"></div>
  <div id="syncStatus" class="sync">Đang kết nối…</div>
</header>
<main id="app"></main>
<footer>EduQuiz — Học mà chơi, chơi mà học • Dữ liệu đồng bộ qua Firebase Firestore</footer>
<script type="module" src="app.js"></script>
</body>
</html>
